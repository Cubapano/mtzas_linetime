<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Navegador Cronológico - Efemérides</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .contenedor {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        
        .navegador {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            font-size: 1.5em;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        button:hover {
            background: #764ba2;
            transform: scale(1.1);
        }
        
        #fechaActual {
            font-size: 1.3em;
            font-weight: bold;
            color: #667eea;
            background: #f0f0f0;
            padding: 12px 25px;
            border-radius: 50px;
            min-width: 280px;
        }
        
        .evento {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            margin-top: 20px;
            animation: aparecer 0.5s ease;
        }
        
        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .descripcion {
            font-size: 1.2em;
            line-height: 1.5;
            margin: 15px 0;
        }
        
        .contador {
            color: #999;
            margin-top: 20px;
            font-size: 0.9em;
        }
        
        .error {
            color: #c62828;
            padding: 20px;
            background: #ffebee;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>📅 Navegador Cronológico</h1>
        
        <div class="navegador">
            <button id="btnAnterior" title="Evento anterior">◀</button>
            <div id="fechaActual">Cargando...</div>
            <button id="btnSiguiente" title="Evento siguiente">▶</button>
        </div>
        
        <div id="contenedor-evento">
            <div class="cargando">Cargando eventos...</div>
        </div>
    </div>

    <script>
        let eventos = [];
        let indiceActual = 0;
        
        async function cargarEventos() {
            const contenedorEvento = document.getElementById('contenedor-evento');
            
            try {
                const respuesta = await fetch('efemerides.json');
                
                if (!respuesta.ok) {
                    throw new Error(`No se pudo cargar el archivo. Código: ${respuesta.status}`);
                }
                
                eventos = await respuesta.json();
                
                if (!eventos || eventos.length === 0) {
                    contenedorEvento.innerHTML = '<div class="error">No hay eventos para mostrar</div>';
                    return;
                }
                
                // Ordenar eventos usando la función especial para fechas incompletas
                eventos.sort((a, b) => {
                    const fechaA = parsearFechaParaOrden(a.FECHA);
                    const fechaB = parsearFechaParaOrden(b.FECHA);
                    return fechaA - fechaB;
                });
                
                indiceActual = 0;
                mostrarEvento(indiceActual);
                
            } catch (error) {
                contenedorEvento.innerHTML = `
                    <div class="error">
                        ❌ Error al cargar las efemérides<br>
                        <small>${error.message}</small>
                    </div>
                `;
                console.error('Error:', error);
            }
        }
        
        // Función para convertir fechas como "1789-06-00" a un objeto Date válido
        function parsearFechaParaOrden(fechaStr) {
            const partes = fechaStr.split('-');
            let anio = parseInt(partes[0]);
            let mes = parseInt(partes[1]) - 1;
            let dia = parseInt(partes[2]);
            
            if (isNaN(mes) || mes < 0) mes = 0;
            if (isNaN(dia) || dia < 1) dia = 1;
            
            return new Date(anio, mes, dia);
        }
        
        function formatearFechaLegible(fechaISO) {
            const partes = fechaISO.split('-');
            const anio = parseInt(partes[0]);
            const mesNumero = parseInt(partes[1]);
            const diaNumero = parseInt(partes[2]);
            
            const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 
                          'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
            
            // Caso 1: Solo año
            if (mesNumero === 0 && diaNumero === 0) {
                return `Año ${anio}`;
            }
            
            // Caso 2: Mes y año
            if (diaNumero === 0 && mesNumero >= 1 && mesNumero <= 12) {
                return `${meses[mesNumero - 1]} de ${anio}`;
            }
            
            // Caso 3: Fecha completa
            if (diaNumero >= 1 && diaNumero <= 31 && mesNumero >= 1 && mesNumero <= 12) {
                return `${diaNumero} de ${meses[mesNumero - 1]} de ${anio}`;
            }
            
            return `${anio}`;
        }
        
        function mostrarEvento(indice) {
            if (indice < 0) indice = 0;
            if (indice >= eventos.length) indice = eventos.length - 1;
            
            const evento = eventos[indice];
            const fechaLegible = formatearFechaLegible(evento.FECHA);
            
            document.getElementById('fechaActual').textContent = fechaLegible;
            
            const contenedorEvento = document.getElementById('contenedor-evento');
            contenedorEvento.style.animation = 'none';
            
            setTimeout(() => {
                contenedorEvento.innerHTML = `
                    <div class="evento">
                        <div class="descripcion">📖 ${evento.EFEMERIDE}</div>
                    </div>
                    <div class="contador">
                        Evento ${indice + 1} de ${eventos.length}
                    </div>
                `;
                contenedorEvento.style.animation = 'aparecer 0.5s ease';
            }, 10);
        }
        
        function eventoAnterior() {
            if (indiceActual > 0) {
                indiceActual--;
                mostrarEvento(indiceActual);
            } else {
                const btn = document.getElementById('btnAnterior');
                btn.style.transform = 'scale(0.9)';
                setTimeout(() => { btn.style.transform = ''; }, 200);
            }
        }
        
        function eventoSiguiente() {
            if (indiceActual < eventos.length - 1) {
                indiceActual++;
                mostrarEvento(indiceActual);
            } else {
                const btn = document.getElementById('btnSiguiente');
                btn.style.transform = 'scale(0.9)';
                setTimeout(() => { btn.style.transform = ''; }, 200);
            }
        }
        
        document.getElementById('btnAnterior').addEventListener('click', eventoAnterior);
        document.getElementById('btnSiguiente').addEventListener('click', eventoSiguiente);
        
        window.addEventListener('DOMContentLoaded', cargarEventos);
    </script>
</body>
</html>
