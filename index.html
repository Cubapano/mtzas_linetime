<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Navegador Cronológico - Efemérides</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .contenedor {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 1.8em;
        }
        
        .navegador {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            font-size: 2em;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        
        button:hover {
            background: #764ba2;
            transform: scale(1.1);
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        #fechaActual {
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
            background: #f0f0f0;
            padding: 15px 25px;
            border-radius: 50px;
            min-width: 250px;
        }
        
        .evento {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            margin-top: 20px;
            animation: aparecer 0.5s ease;
        }
        
        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .descripcion {
            font-size: 1.3em;
            line-height: 1.5;
            margin: 15px 0;
        }
        
        .contador {
            color: #999;
            margin-top: 20px;
            font-size: 0.9em;
        }
        
        .error {
            color: #c62828;
            padding: 20px;
            background: #ffebee;
            border-radius: 10px;
        }
        
        .cargando {
            text-align: center;
            color: #666;
            padding: 50px;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>📅 Navegador Cronológico</h1>
        
        <div class="navegador">
            <button id="btnAnterior" title="Evento anterior">◀</button>
            <div id="fechaActual">Cargando...</div>
            <button id="btnSiguiente" title="Evento siguiente">▶</button>
        </div>
        
        <div id="contenedor-evento">
            <div class="cargando">Cargando eventos...</div>
        </div>
    </div>

    <script>
        let eventos = [];      // Array para guardar todos los eventos
        let indiceActual = 0;  // Índice del evento que se muestra ahora
        
        async function cargarEventos() {
            const contenedorEvento = document.getElementById('contenedor-evento');
            
            try {
                const respuesta = await fetch('efemerides.json');
                
                if (!respuesta.ok) {
                    throw new Error(`No se pudo cargar el archivo. Código: ${respuesta.status}`);
                }
                
                eventos = await respuesta.json();
                
                if (!eventos || eventos.length === 0) {
                    contenedorEvento.innerHTML = '<div class="error">No hay eventos para mostrar</div>';
                    return;
                }
                
                // Ordenar eventos por fecha (del más antiguo al más reciente)
                eventos.sort((a, b) => {
                    return new Date(a.FECHA) - new Date(b.FECHA);
                });
                
                // Mostrar el primer evento (el más antiguo)
                indiceActual = 0;
                mostrarEvento(indiceActual);
                
            } catch (error) {
                contenedorEvento.innerHTML = `
                    <div class="error">
                        ❌ Error al cargar las efemérides<br>
                        <small>${error.message}</small>
                    </div>
                `;
                console.error('Error:', error);
            }
        }
        
        function formatearFecha(fechaISO) {
            // fechaISO viene como "1693-10-12"
            const partes = fechaISO.split('-');
            const anio = parseInt(partes[0]);
            const mes = parseInt(partes[1]) - 1; // Meses de 0-11
            const dia = parseInt(partes[2]);
            
            const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 
                          'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
            
            return `${dia} de ${meses[mes]} de ${anio}`;
        }
        
        function mostrarEvento(indice) {
            // Verificar que el índice sea válido
            if (indice < 0) indice = 0;
            if (indice >= eventos.length) indice = eventos.length - 1;
            
            const evento = eventos[indice];
            
            // Formatear la fecha
            const fechaLegible = formatearFecha(evento.FECHA);
            
            // Actualizar el título con la fecha
            document.getElementById('fechaActual').textContent = fechaLegible;
            
            // Mostrar la descripción con animación
            const contenedorEvento = document.getElementById('contenedor-evento');
            contenedorEvento.style.animation = 'none';
            setTimeout(() => {
                contenedorEvento.innerHTML = `
                    <div class="evento">
                        <div class="descripcion">📖 ${evento.EFEMERIDE}</div>
                    </div>
                    <div class="contador">
                        Evento ${indice + 1} de ${eventos.length}
                    </div>
                `;
                contenedorEvento.style.animation = 'aparecer 0.5s ease';
            }, 10);
        }
        
        function eventoAnterior() {
            if (indiceActual > 0) {
                indiceActual--;
                mostrarEvento(indiceActual);
            } else {
                // Si ya está en el primero, mostrar animación de rebote
                const btn = document.getElementById('btnAnterior');
                btn.style.transform = 'scale(0.9)';
                setTimeout(() => { btn.style.transform = ''; }, 200);
            }
        }
        
        function eventoSiguiente() {
            if (indiceActual < eventos.length - 1) {
                indiceActual++;
                mostrarEvento(indiceActual);
            } else {
                // Si ya está en el último, mostrar animación de rebote
                const btn = document.getElementById('btnSiguiente');
                btn.style.transform = 'scale(0.9)';
                setTimeout(() => { btn.style.transform = ''; }, 200);
            }
        }
        
        // Conectar los botones a las funciones
        document.getElementById('btnAnterior').addEventListener('click', eventoAnterior);
        document.getElementById('btnSiguiente').addEventListener('click', eventoSiguiente);
        
        // Cargar eventos al iniciar
        window.addEventListener('DOMContentLoaded', cargarEventos);
    </script>
</body>
</html>
