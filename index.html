<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Línea de Tiempo - Efemérides</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .contenedor {
            background: white;
            border-radius: 32px;
            padding: 24px 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
        }
        
        h1 {
            color: #333;
            margin: 0 0 20px 0;
            font-size: 1.6em;
            text-align: center;
        }
        
        /* Buscador */
        .buscador {
            margin-bottom: 24px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        #inputBusqueda {
            flex: 1;
            padding: 14px 16px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            outline: none;
            background: white;
            text-align: center;
        }
        
        #inputBusqueda:focus {
            border-color: #667eea;
        }
        
        .btn-icono {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            font-size: 1.3em;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #f0f0f0;
            color: #555;
        }
        
        #btnBuscar {
            background: #667eea;
            color: white;
        }
        
        #btnLimpiar {
            background: #f0f0f0;
            color: #666;
        }
        
        .btn-icono:active {
            transform: scale(0.95);
        }
        
        /* ===== SELECTOR DE 3 FECHAS ===== */
        .selector-tres {
            margin: 20px 0 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* Botón arriba - flecha centrada */
        .btn-nav-up {
            background: #667eea;
            color: white;
            border: none;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            font-size: 1.8em;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-nav-up:active {
            transform: scale(0.95);
        }
        
        /* Lista de 3 fechas */
        .fechas-lista {
            display: flex;
            flex-direction: column;
            width: 100%;
            background: #f5f5f5;
            border-radius: 28px;
            overflow: hidden;
        }
        
        .fecha-item {
            padding: 16px 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            border-bottom: 1px solid #e0e0e0;
            font-weight: bold;
        }
        
        .fecha-item:last-child {
            border-bottom: none;
        }
        
        /* Fecha superior (difuminada) */
        .fecha-item.top {
            background: #f0f0f0;
            opacity: 0.5;
            transform: scale(0.95);
            font-size: 0.9em;
        }
        
        /* Fecha central (ACTIVA - destacada) */
        .fecha-item.center {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: scale(1);
            box-shadow: 0 4px 15px rgba(102,126,234,0.4);
            font-size: 1.1em;
            font-weight: bold;
        }
        
        /* Fecha inferior (difuminada) */
        .fecha-item.bottom {
            background: #f0f0f0;
            opacity: 0.5;
            transform: scale(0.95);
            font-size: 0.9em;
        }
        
        /* Botón abajo - flecha centrada */
        .btn-nav-down {
            background: #667eea;
            color: white;
            border: none;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            font-size: 1.8em;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-nav-down:active {
            transform: scale(0.95);
        }
        
        /* Detalle del evento (solo descripción) */
        .detalle-evento {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 28px 20px;
            border-radius: 24px;
            margin: 20px 0 15px;
            animation: aparecer 0.3s ease;
            text-align: center;
        }
        
        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .detalle-descripcion {
            font-size: 1.15em;
            line-height: 1.5;
        }
        
        .contador-info {
            text-align: center;
            color: #999;
            margin-top: 12px;
            font-size: 0.85em;
        }
        
        .resultado-busqueda {
            background: #e3f2fd;
            color: #1976d2;
            padding: 8px 16px;
            border-radius: 30px;
            margin-bottom: 15px;
            font-size: 0.85em;
            text-align: center;
        }
        
        .error {
            color: #c62828;
            padding: 20px;
            background: #ffebee;
            border-radius: 10px;
            text-align: center;
        }
        
        /* Móvil pequeño */
        @media (max-width: 480px) {
            .contenedor {
                padding: 16px;
            }
            .fecha-item {
                padding: 12px 16px;
            }
            .detalle-evento {
                padding: 20px 16px;
            }
            .detalle-descripcion {
                font-size: 1em;
            }
            .btn-nav-up, .btn-nav-down {
                width: 48px;
                height: 48px;
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>📅 Línea de Tiempo</h1>
        
        <!-- Buscador -->
        <div class="buscador">
            <input type="text" id="inputBusqueda" placeholder="Buscar...">
            <button id="btnBuscar" class="btn-icono" title="Buscar">🔍</button>
            <button id="btnLimpiar" class="btn-icono" title="Limpiar">✖</button>
        </div>
        
        <!-- Selector de 3 fechas -->
        <div class="selector-tres">
            <button id="btnUp" class="btn-nav-up" title="Anterior">▲</button>
            
            <div class="fechas-lista" id="fechasLista">
                <div class="fecha-item top" id="fechaTop">
                    ...
                </div>
                <div class="fecha-item center" id="fechaCenter">
                    ...
                </div>
                <div class="fecha-item bottom" id="fechaBottom">
                    ...
                </div>
            </div>
            
            <button id="btnDown" class="btn-nav-down" title="Siguiente">▼</button>
        </div>
        
        <!-- Detalle del evento (solo descripción) -->
        <div id="detalleContainer">
            <div class="detalle-evento" style="text-align:center; padding:30px;">Cargando...</div>
        </div>
        
        <div id="extraInfo" class="contador-info"></div>
    </div>

    <script>
        let eventosOriginales = [];
        let eventosFiltrados = [];
        let indiceActual = 0;
        let modoBusqueda = false;
        let textoBusqueda = '';
        
        async function cargarEventos() {
            try {
                const respuesta = await fetch('efemerides.json');
                if (!respuesta.ok) throw new Error(`Error ${respuesta.status}`);
                
                eventosOriginales = await respuesta.json();
                
                if (!eventosOriginales || eventosOriginales.length === 0) {
                    document.getElementById('detalleContainer').innerHTML = '<div class="error">No hay eventos</div>';
                    return;
                }
                
                // Ordenar por fecha
                eventosOriginales.sort((a, b) => {
                    const fechaA = parsearFechaParaOrden(a.FECHA);
                    const fechaB = parsearFechaParaOrden(b.FECHA);
                    return fechaA - fechaB;
                });
                
                eventosFiltrados = [...eventosOriginales];
                indiceActual = 0;
                
                actualizarVista();
                
            } catch (error) {
                document.getElementById('detalleContainer').innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }
        
        function parsearFechaParaOrden(fechaStr) {
            const partes = fechaStr.split('-');
            let anio = parseInt(partes[0]);
            let mes = parseInt(partes[1]) - 1;
            let dia = parseInt(partes[2]);
            if (isNaN(mes) || mes < 0) mes = 0;
            if (isNaN(dia) || dia < 1) dia = 1;
            return new Date(anio, mes, dia);
        }
        
        function formatearFechaCorta(fechaISO) {
            const partes = fechaISO.split('-');
            const anio = parseInt(partes[0]);
            const mesNumero = parseInt(partes[1]);
            if (mesNumero === 0) return `${anio}`;
            const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
            return `${meses[mesNumero-1]} ${anio}`;
        }
        
        function formatearFechaLegible(fechaISO) {
            const partes = fechaISO.split('-');
            const anio = parseInt(partes[0]);
            const mesNumero = parseInt(partes[1]);
            const diaNumero = parseInt(partes[2]);
            const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 
                          'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
            
            if (mesNumero === 0 && diaNumero === 0) return `Año ${anio}`;
            if (diaNumero === 0 && mesNumero >= 1) return `${meses[mesNumero-1]} de ${anio}`;
            if (diaNumero >= 1 && mesNumero >= 1) return `${diaNumero} de ${meses[mesNumero-1]} de ${anio}`;
            return `${anio}`;
        }
        
        function obtenerEventoPorIndice(indice) {
            if (indice < 0 || indice >= eventosFiltrados.length) return null;
            return eventosFiltrados[indice];
        }
        
        function actualizarVista() {
            if (!eventosFiltrados.length) return;
            
            // Obtener los 3 eventos
            const eventoAnterior = obtenerEventoPorIndice(indiceActual - 1);
            const eventoActual = eventosFiltrados[indiceActual];
            const eventoSiguiente = obtenerEventoPorIndice(indiceActual + 1);
            
            // Actualizar fecha superior
            const topDiv = document.getElementById('fechaTop');
            if (eventoAnterior) {
                topDiv.textContent = formatearFechaCorta(eventoAnterior.FECHA);
                topDiv.style.opacity = '0.5';
                topDiv.style.display = 'block';
            } else {
                topDiv.textContent = '---';
                topDiv.style.opacity = '0.3';
            }
            
            // Actualizar fecha central (ACTIVA)
            const centerDiv = document.getElementById('fechaCenter');
            centerDiv.textContent = formatearFechaCorta(eventoActual.FECHA);
            
            // Actualizar fecha inferior
            const bottomDiv = document.getElementById('fechaBottom');
            if (eventoSiguiente) {
                bottomDiv.textContent = formatearFechaCorta(eventoSiguiente.FECHA);
                bottomDiv.style.opacity = '0.5';
                bottomDiv.style.display = 'block';
            } else {
                bottomDiv.textContent = '---';
                bottomDiv.style.opacity = '0.3';
            }
            
            // Actualizar detalle (solo descripción)
            let html = '';
            if (modoBusqueda) {
                html += `<div class="resultado-busqueda">🔍 ${eventosFiltrados.length} resultado(s): "${textoBusqueda}"</div>`;
            }
            html += `
                <div class="detalle-evento">
                    <div class="detalle-descripcion">📖 ${eventoActual.EFEMERIDE}</div>
                </div>
                <div class="contador-info">
                    ${modoBusqueda ? 'Resultado ' : 'Evento '} ${indiceActual + 1} de ${eventosFiltrados.length}
                </div>
            `;
            document.getElementById('detalleContainer').innerHTML = html;
        }
        
        function moverArriba() {
            if (indiceActual > 0) {
                indiceActual--;
                actualizarVista();
                animarBoton('up');
            } else {
                const btn = document.getElementById('btnUp');
                btn.style.transform = 'scale(0.9)';
                setTimeout(() => { btn.style.transform = ''; }, 200);
            }
        }
        
        function moverAbajo() {
            if (indiceActual < eventosFiltrados.length - 1) {
                indiceActual++;
                actualizarVista();
                animarBoton('down');
            } else {
                const btn = document.getElementById('btnDown');
                btn.style.transform = 'scale(0.9)';
                setTimeout(() => { btn.style.transform = ''; }, 200);
            }
        }
        
        function animarBoton(direccion) {
            const btn = document.getElementById(direccion === 'up' ? 'btnUp' : 'btnDown');
            btn.style.transform = 'scale(0.9)';
            setTimeout(() => { btn.style.transform = ''; }, 150);
        }
        
        function buscarEventos() {
            const input = document.getElementById('inputBusqueda');
            textoBusqueda = input.value.trim().toLowerCase();
            
            if (textoBusqueda === '') {
                eventosFiltrados = [...eventosOriginales];
                modoBusqueda = false;
            } else {
                eventosFiltrados = eventosOriginales.filter(evento => 
                    evento.EFEMERIDE.toLowerCase().includes(textoBusqueda)
                );
                modoBusqueda = true;
            }
            
            if (eventosFiltrados.length === 0) {
                document.getElementById('detalleContainer').innerHTML = `<div class="error">🔍 No se encontró "${textoBusqueda}"</div>`;
                document.getElementById('fechaTop').textContent = '---';
                document.getElementById('fechaCenter').textContent = '---';
                document.getElementById('fechaBottom').textContent = '---';
                return;
            }
            
            indiceActual = 0;
            actualizarVista();
        }
        
        function limpiarBusqueda() {
            document.getElementById('inputBusqueda').value = '';
            eventosFiltrados = [...eventosOriginales];
            modoBusqueda = false;
            textoBusqueda = '';
            indiceActual = 0;
            actualizarVista();
        }
        
        // Click en fechas laterales
        document.getElementById('fechaTop').addEventListener('click', () => {
            if (indiceActual > 0) moverArriba();
        });
        
        document.getElementById('fechaBottom').addEventListener('click', () => {
            if (indiceActual < eventosFiltrados.length - 1) moverAbajo();
        });
        
        // Event listeners
        document.getElementById('btnUp').addEventListener('click', moverArriba);
        document.getElementById('btnDown').addEventListener('click', moverAbajo);
        document.getElementById('btnBuscar').addEventListener('click', buscarEventos);
        document.getElementById('btnLimpiar').addEventListener('click', limpiarBusqueda);
        document.getElementById('inputBusqueda').addEventListener('keypress', (e) => { if (e.key === 'Enter') buscarEventos(); });
        
        window.addEventListener('DOMContentLoaded', cargarEventos);
    </script>
</body>
</html>
