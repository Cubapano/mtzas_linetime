<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Navegador Cronológico - Efemérides</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .contenedor {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8em;
        }
        
        /* Buscador con botones de íconos */
        .buscador {
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        #inputBusqueda {
            flex: 2;
            min-width: 180px;
            padding: 12px 20px;
            font-size: 1em;
            border: 2px solid #ddd;
            border-radius: 50px;
            outline: none;
            transition: all 0.3s ease;
        }
        
        #inputBusqueda:focus {
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102,126,234,0.3);
        }
        
        /* Botones solo con íconos */
        .btn-icono {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            font-size: 1.3em;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f0f0f0;
            color: #555;
        }
        
        .btn-icono:hover {
            transform: scale(1.05);
        }
        
        #btnBuscar {
            background: #667eea;
            color: white;
        }
        
        #btnBuscar:hover {
            background: #764ba2;
        }
        
        #btnLimpiar {
            background: #f0f0f0;
            color: #666;
        }
        
        #btnLimpiar:hover {
            background: #ddd;
        }
        
        /* Línea de tiempo horizontal */
        .timeline-container {
            margin: 20px 0 25px 0;
            padding: 10px 0;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: thin;
            position: relative;
        }
        
        .timeline-track {
            display: inline-flex;
            gap: 30px;
            padding: 10px 20px;
            background: #f5f5f5;
            border-radius: 50px;
            min-width: 100%;
            justify-content: center;
        }
        
        .timeline-punto {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0.6;
        }
        
        .timeline-punto.activo {
            opacity: 1;
        }
        
        .timeline-punto:hover {
            transform: translateY(-3px);
            opacity: 1;
        }
        
        .punto-circulo {
            width: 12px;
            height: 12px;
            background: #667eea;
            border-radius: 50%;
            margin-bottom: 5px;
            transition: all 0.3s ease;
        }
        
        .timeline-punto.activo .punto-circulo {
            width: 16px;
            height: 16px;
            background: #764ba2;
            box-shadow: 0 0 0 3px rgba(118,75,162,0.2);
        }
        
        .punto-fecha {
            font-size: 0.65em;
            color: #666;
            white-space: normal;
            word-break: keep-all;
            max-width: 70px;
            text-align: center;
            line-height: 1.3;
        }
        
        /* Para móvil: acortar fechas en timeline */
        @media (max-width: 600px) {
            .timeline-track {
                gap: 15px;
            }
            .punto-fecha {
                font-size: 0.55em;
                max-width: 55px;
            }
        }
        
        /* Navegador principal */
        .navegador {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .nav-btn {
            background: #667eea;
            color: white;
            border: none;
            font-size: 1.5em;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .nav-btn:hover {
            background: #764ba2;
            transform: scale(1.1);
        }
        
        #fechaActual {
            font-size: 1.3em;
            font-weight: bold;
            color: #667eea;
            background: #f0f0f0;
            padding: 12px 25px;
            border-radius: 50px;
            min-width: 280px;
        }
        
        .evento {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            margin-top: 5px;
            animation: aparecer 0.4s ease;
        }
        
        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .descripcion {
            font-size: 1.2em;
            line-height: 1.5;
            margin: 15px 0;
        }
        
        .contador {
            color: #999;
            margin-top: 20px;
            font-size: 0.9em;
        }
        
        .resultado-busqueda {
            background: #e3f2fd;
            color: #1976d2;
            padding: 8px 12px;
            border-radius: 20px;
            margin-bottom: 15px;
            font-size: 0.85em;
            display: inline-block;
        }
        
        .error {
            color: #c62828;
            padding: 20px;
            background: #ffebee;
            border-radius: 10px;
        }
        
        /* Ocultar scrollbar en timeline (opcional, más limpio) */
        .timeline-container::-webkit-scrollbar {
            height: 4px;
        }
        .timeline-container::-webkit-scrollbar-track {
            background: #e0e0e0;
            border-radius: 4px;
        }
        .timeline-container::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>📅 Navegador Cronológico</h1>
        
        <!-- Buscador con botones de íconos -->
        <div class="buscador">
            <input type="text" id="inputBusqueda" placeholder="Buscar...">
            <button id="btnBuscar" class="btn-icono" title="Buscar">🔍</button>
            <button id="btnLimpiar" class="btn-icono" title="Limpiar">✖</button>
        </div>
        
        <!-- Línea de tiempo horizontal (solo visual) -->
        <div class="timeline-container" id="timelineContainer">
            <div class="timeline-track" id="timelineTrack">
                <!-- Se llena con JavaScript -->
            </div>
        </div>
        
        <!-- Navegador principal -->
        <div class="navegador">
            <button id="btnAnterior" class="nav-btn" title="Anterior">◀</button>
            <div id="fechaActual">Cargando...</div>
            <button id="btnSiguiente" class="nav-btn" title="Siguiente">▶</button>
        </div>
        
        <div id="contenedor-evento">
            <div class="cargando">Cargando eventos...</div>
        </div>
    </div>

    <script>
        let eventosOriginales = [];
        let eventosFiltrados = [];
        let indiceActual = 0;
        let modoBusqueda = false;
        let textoBusqueda = '';
        
        async function cargarEventos() {
            const contenedorEvento = document.getElementById('contenedor-evento');
            
            try {
                const respuesta = await fetch('efemerides.json');
                
                if (!respuesta.ok) {
                    throw new Error(`No se pudo cargar el archivo. Código: ${respuesta.status}`);
                }
                
                eventosOriginales = await respuesta.json();
                
                if (!eventosOriginales || eventosOriginales.length === 0) {
                    contenedorEvento.innerHTML = '<div class="error">No hay eventos para mostrar</div>';
                    return;
                }
                
                // Ordenar por fecha
                eventosOriginales.sort((a, b) => {
                    const fechaA = parsearFechaParaOrden(a.FECHA);
                    const fechaB = parsearFechaParaOrden(b.FECHA);
                    return fechaA - fechaB;
                });
                
                eventosFiltrados = [...eventosOriginales];
                indiceActual = 0;
                
                actualizarTimeline();  // Dibujar línea de tiempo
                mostrarEvento(indiceActual);
                
            } catch (error) {
                contenedorEvento.innerHTML = `
                    <div class="error">
                        ❌ Error al cargar las efemérides<br>
                        <small>${error.message}</small>
                    </div>
                `;
            }
        }
        
        function parsearFechaParaOrden(fechaStr) {
            const partes = fechaStr.split('-');
            let anio = parseInt(partes[0]);
            let mes = parseInt(partes[1]) - 1;
            let dia = parseInt(partes[2]);
            if (isNaN(mes) || mes < 0) mes = 0;
            if (isNaN(dia) || dia < 1) dia = 1;
            return new Date(anio, mes, dia);
        }
        
        function formatearFechaLegible(fechaISO) {
            const partes = fechaISO.split('-');
            const anio = parseInt(partes[0]);
            const mesNumero = parseInt(partes[1]);
            const diaNumero = parseInt(partes[2]);
            const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 
                          'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
            
            if (mesNumero === 0 && diaNumero === 0) return `Año ${anio}`;
            if (diaNumero === 0 && mesNumero >= 1 && mesNumero <= 12) return `${meses[mesNumero - 1]} de ${anio}`;
            if (diaNumero >= 1 && diaNumero <= 31 && mesNumero >= 1 && mesNumero <= 12) return `${diaNumero} de ${meses[mesNumero - 1]} de ${anio}`;
            return `${anio}`;
        }
        
        function formatearFechaCorta(fechaISO) {
            const partes = fechaISO.split('-');
            const anio = parseInt(partes[0]);
            const mesNumero = parseInt(partes[1]);
            if (mesNumero === 0) return `${anio}`;
            const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
            return `${meses[mesNumero-1]} ${anio}`;
        }
        
        function actualizarTimeline() {
            const track = document.getElementById('timelineTrack');
            if (!track) return;
            
            // Mostrar máximo 15 eventos en la línea para no saturar
            const eventosMostrar = eventosFiltrados.slice(0, 15);
            
            track.innerHTML = eventosMostrar.map((evento, idx) => `
                <div class="timeline-punto ${idx === indiceActual ? 'activo' : ''}" data-idx="${idx}">
                    <div class="punto-circulo"></div>
                    <div class="punto-fecha">${formatearFechaCorta(evento.FECHA)}</div>
                </div>
            `).join('');
            
            // Agregar evento click a cada punto
            document.querySelectorAll('.timeline-punto').forEach(punto => {
                punto.addEventListener('click', () => {
                    const idx = parseInt(punto.dataset.idx);
                    if (!isNaN(idx) && idx >= 0 && idx < eventosFiltrados.length) {
                        indiceActual = idx;
                        mostrarEvento(indiceActual);
                        actualizarTimeline();
                    }
                });
            });
        }
        
        function buscarEventos() {
            const input = document.getElementById('inputBusqueda');
            textoBusqueda = input.value.trim().toLowerCase();
            
            if (textoBusqueda === '') {
                eventosFiltrados = [...eventosOriginales];
                modoBusqueda = false;
            } else {
                eventosFiltrados = eventosOriginales.filter(evento => 
                    evento.EFEMERIDE.toLowerCase().includes(textoBusqueda)
                );
                modoBusqueda = true;
            }
            
            if (eventosFiltrados.length === 0) {
                const contenedor = document.getElementById('contenedor-evento');
                contenedor.innerHTML = `<div class="error">🔍 No se encontraron eventos con "<strong>${textoBusqueda}</strong>"</div>`;
                document.getElementById('fechaActual').textContent = 'Sin resultados';
                document.getElementById('timelineTrack').innerHTML = '';
                return;
            }
            
            indiceActual = 0;
            actualizarTimeline();
            mostrarEvento(indiceActual);
        }
        
        function limpiarBusqueda() {
            document.getElementById('inputBusqueda').value = '';
            eventosFiltrados = [...eventosOriginales];
            modoBusqueda = false;
            textoBusqueda = '';
            indiceActual = 0;
            actualizarTimeline();
            mostrarEvento(indiceActual);
        }
        
        function mostrarEvento(indice) {
            if (!eventosFiltrados || eventosFiltrados.length === 0) return;
            
            if (indice < 0) indice = 0;
            if (indice >= eventosFiltrados.length) indice = eventosFiltrados.length - 1;
            
            const evento = eventosFiltrados[indice];
            const fechaLegible = formatearFechaLegible(evento.FECHA);
            
            document.getElementById('fechaActual').textContent = fechaLegible;
            
            const contenedorEvento = document.getElementById('contenedor-evento');
            contenedorEvento.style.animation = 'none';
            
            setTimeout(() => {
                let html = '';
                if (modoBusqueda) {
                    html += `<div class="resultado-busqueda">🔍 ${eventosFiltrados.length} resultado(s): "${textoBusqueda}"</div>`;
                }
                html += `
                    <div class="evento">
                        <div class="descripcion">📖 ${evento.EFEMERIDE}</div>
                    </div>
                    <div class="contador">
                        ${modoBusqueda ? 'Resultado ' : 'Evento '} ${indice + 1} de ${eventosFiltrados.length}
                    </div>
                `;
                contenedorEvento.innerHTML = html;
                contenedorEvento.style.animation = 'aparecer 0.4s ease';
            }, 10);
            
            // Actualizar clase activa en timeline
            document.querySelectorAll('.timeline-punto').forEach((punto, i) => {
                if (i === indiceActual) punto.classList.add('activo');
                else punto.classList.remove('activo');
            });
        }
        
        function eventoAnterior() {
            if (indiceActual > 0) {
                indiceActual--;
                mostrarEvento(indiceActual);
                actualizarTimeline();
            } else {
                const btn = document.getElementById('btnAnterior');
                btn.style.transform = 'scale(0.9)';
                setTimeout(() => { btn.style.transform = ''; }, 200);
            }
        }
        
        function eventoSiguiente() {
            if (indiceActual < eventosFiltrados.length - 1) {
                indiceActual++;
                mostrarEvento(indiceActual);
                actualizarTimeline();
            } else {
                const btn = document.getElementById('btnSiguiente');
                btn.style.transform = 'scale(0.9)';
                setTimeout(() => { btn.style.transform = ''; }, 200);
            }
        }
        
        // Event listeners
        document.getElementById('btnAnterior').addEventListener('click', eventoAnterior);
        document.getElementById('btnSiguiente').addEventListener('click', eventoSiguiente);
        document.getElementById('btnBuscar').addEventListener('click', buscarEventos);
        document.getElementById('btnLimpiar').addEventListener('click', limpiarBusqueda);
        document.getElementById('inputBusqueda').addEventListener('keypress', (e) => { if (e.key === 'Enter') buscarEventos(); });
        
        window.addEventListener('DOMContentLoaded', cargarEventos);
    </script>
</body>
</html>
