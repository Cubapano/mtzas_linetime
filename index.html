<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Línea de Tiempo - Efemérides de Matanzas</title>
    <style>
        /* --- ESTILOS (Igual que antes) --- */
        * { box-sizing: border-box; user-select: none; }
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .contenedor { background: white; border-radius: 32px; padding: 24px 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 550px; width: 90%; margin: 20px auto; }
        h1 { color: #333; margin: 0 0 20px 0; font-size: 1.6em; text-align: center; }
        .buscador { margin-bottom: 24px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        #inputBusqueda { flex: 2; min-width: 180px; padding: 14px 16px; font-size: 16px; border: 2px solid #e0e0e0; border-radius: 50px; outline: none; background: white; text-align: center; }
        #inputBusqueda:focus { border-color: #667eea; }
        .btn-icono { width: 52px; height: 52px; border-radius: 50%; border: none; font-size: 1.3em; cursor: pointer; transition: all 0.2s ease; background: #f0f0f0; color: #555; }
        #btnBuscar { background: #667eea; color: white; }
        #btnLimpiar { background: #f0f0f0; color: #666; }
        .btn-icono:active { transform: scale(0.95); }
        .filtro-mensaje { background: #e3f2fd; color: #1976d2; padding: 8px 16px; border-radius: 30px; margin: 0 0 15px 0; font-size: 0.85em; text-align: center; display: inline-block; width: auto; }
        .filtro-container { text-align: center; margin-bottom: 10px; }
        .selector-tres { margin: 20px 0 10px; display: flex; flex-direction: column; align-items: center; }
        .btn-nav-up, .btn-nav-down { background: #667eea; color: white; border: none; width: 56px; height: 56px; border-radius: 50%; font-size: 1.8em; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 10px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; }
        .btn-nav-up { margin-bottom: 8px; }
        .btn-nav-down { margin-top: 8px; }
        .btn-nav-up:active, .btn-nav-down:active { transform: scale(0.95); }
        .fechas-lista { display: flex; flex-direction: column; width: 100%; background: #f5f5f5; border-radius: 28px; overflow: hidden; }
        .fecha-item { padding: 16px 20px; text-align: center; transition: all 0.3s ease; cursor: pointer; border-bottom: 1px solid #e0e0e0; font-weight: bold; }
        .fecha-item:last-child { border-bottom: none; }
        .fecha-item.top { background: #f0f0f0; opacity: 0.5; transform: scale(0.95); font-size: 0.9em; }
        .fecha-item.center { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; transform: scale(1); box-shadow: 0 4px 15px rgba(102,126,234,0.4); font-size: 1.1em; font-weight: bold; }
        .fecha-item.bottom { background: #f0f0f0; opacity: 0.5; transform: scale(0.95); font-size: 0.9em; }
        .detalle-wrapper { min-height: 180px; margin: 20px 0 15px; }
        .detalle-evento { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 24px; animation: aparecer 0.25s ease; height: 180px; overflow-y: auto; padding: 20px 18px; }
        .detalle-evento::-webkit-scrollbar { width: 4px; }
        .detalle-evento::-webkit-scrollbar-track { background: rgba(255,255,255,0.2); border-radius: 4px; }
        .detalle-evento::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.5); border-radius: 4px; }
        @keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }
        .detalle-descripcion { font-size: 1.1em; line-height: 1.5; margin: 0; width: 100%; }
        .highlight { background-color: #ffeb3b; color: #333; font-weight: bold; padding: 0 2px; border-radius: 4px; }
        .contador-info { text-align: center; color: #999; margin-top: 12px; font-size: 0.85em; }
        .error { color: #c62828; padding: 20px; background: #ffebee; border-radius: 10px; text-align: center; }
        
        @media (max-width: 480px) {
            .contenedor { padding: 16px; width: 95%; margin: 10px auto; }
            .fecha-item { padding: 12px 16px; }
            .detalle-evento { height: 160px; padding: 16px 14px; }
            .detalle-wrapper { min-height: 160px; }
            .detalle-descripcion { font-size: 1em; }
            .btn-nav-up, .btn-nav-down { width: 48px; height: 48px; font-size: 1.5em; }
        }
        @media (min-width: 481px) and (max-width: 768px) {
            .detalle-evento { height: 200px; padding: 22px 20px; }
            .detalle-wrapper { min-height: 200px; }
        }
        @media (min-height: 800px) { .contenedor { margin: 30px auto; } }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>📅 Línea de tiempo de Matanzas</h1>
        
        <div class="buscador">
            <input type="text" id="inputBusqueda" placeholder="Buscar... ej: bahía, fundación, 1693">
            <button id="btnBuscar" class="btn-icono" title="Buscar">🔍</button>
            <button id="btnLimpiar" class="btn-icono" title="Limpiar">✖</button>
        </div>
        
        <div id="filtroMensaje" class="filtro-container"></div>
        
        <div class="selector-tres">
            <button id="btnUp" class="btn-nav-up" title="Anterior">▲</button>
            <div class="fechas-lista" id="fechasLista">
                <div class="fecha-item top" id="fechaTop">...</div>
                <div class="fecha-item center" id="fechaCenter">...</div>
                <div class="fecha-item bottom" id="fechaBottom">...</div>
            </div>
            <button id="btnDown" class="btn-nav-down" title="Siguiente">▼</button>
        </div>
        
        <div class="detalle-wrapper" id="detalleWrapper">
            <div class="detalle-evento" id="detalleEvento">
                <div class="detalle-descripcion">Cargando...</div>
            </div>
        </div>
        
        <div id="extraInfo" class="contador-info"></div>
    </div>

    <script>
        let eventosOriginales = [];
        let eventosFiltrados = [];
        let indiceActual = 0;
        let modoBusqueda = false;
        let textoBusqueda = '';

        // --- NUEVA FUNCIÓN: Elimina acentos y convierte a minúsculas ---
        function normalizar(texto) {
            return texto
                .toLowerCase()
                .normalize('NFD')                // Descompone caracteres: "é" -> "e" + "´"
                .replace(/[\u0300-\u036f]/g, ''); // Elimina los diacríticos (acentos)
        }

        async function cargarEventos() {
            try {
                const respuesta = await fetch('efemerides.json');
                if (!respuesta.ok) throw new Error(`Error ${respuesta.status}`);
                
                eventosOriginales = await respuesta.json();
                
                if (!eventosOriginales || eventosOriginales.length === 0) {
                    document.getElementById('detalleEvento').innerHTML = '<div class="error">No hay eventos</div>';
                    return;
                }
                
                eventosOriginales.sort((a, b) => {
                    const fechaA = parsearFechaParaOrden(a.FECHA);
                    const fechaB = parsearFechaParaOrden(b.FECHA);
                    return fechaA - fechaB;
                });
                
                eventosFiltrados = [...eventosOriginales];
                indiceActual = 0;
                actualizarVista();
                
            } catch (error) {
                document.getElementById('detalleEvento').innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }
        
        function parsearFechaParaOrden(fechaStr) {
            const partes = fechaStr.split('-');
            let anio = parseInt(partes[0]);
            let mes = parseInt(partes[1]) - 1;
            let dia = parseInt(partes[2]);
            if (isNaN(mes) || mes < 0) mes = 0;
            if (isNaN(dia) || dia < 1) dia = 1;
            return new Date(anio, mes, dia);
        }
        
        function formatearFechaCorta(fechaISO) {
            const partes = fechaISO.split('-');
            const anio = parseInt(partes[0]);
            const mesNumero = parseInt(partes[1]);
            const diaNumero = parseInt(partes[2]);
            const meses = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
            
            if (diaNumero >= 1 && diaNumero <= 31 && mesNumero >= 1 && mesNumero <= 12) {
                return `${diaNumero} ${meses[mesNumero-1]} ${anio}`;
            }
            if (diaNumero === 0 && mesNumero >= 1 && mesNumero <= 12) {
                return `${meses[mesNumero-1]} ${anio}`;
            }
            if (mesNumero === 0 && diaNumero === 0) return `${anio}`;
            return `${anio}`;
        }
        
        function formatearFechaLegible(fechaISO) {
            const partes = fechaISO.split('-');
            const anio = parseInt(partes[0]);
            const mesNumero = parseInt(partes[1]);
            const diaNumero = parseInt(partes[2]);
            const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 
                          'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
            
            if (diaNumero >= 1 && diaNumero <= 31 && mesNumero >= 1 && mesNumero <= 12) {
                return `${diaNumero} de ${meses[mesNumero-1]} de ${anio}`;
            }
            if (diaNumero === 0 && mesNumero >= 1 && mesNumero <= 12) {
                return `${meses[mesNumero-1]} de ${anio}`;
            }
            if (mesNumero === 0 && diaNumero === 0) return `Año ${anio}`;
            return `${anio}`;
        }

        // --- FUNCIÓN DE BÚSQUEDA MODIFICADA (Usa normalización) ---
        function eventoCoincide(evento, busqueda) {
            if (!busqueda) return true;

            // Normalizamos (sin acentos y minúsculas) el término de búsqueda y el texto a comparar
            const busquedaNorm = normalizar(busqueda);
            
            // 1. Buscar en la efeméride (normalizada)
            if (normalizar(evento.EFEMERIDE).includes(busquedaNorm)) {
                return true;
            }

            // 2. Buscar en la fecha legible (normalizada)
            const fechaLegible = formatearFechaLegible(evento.FECHA);
            if (normalizar(fechaLegible).includes(busquedaNorm)) {
                return true;
            }

            // 3. Buscar en la fecha ISO (normalizada, por si el usuario busca "1693-10")
            if (normalizar(evento.FECHA).includes(busquedaNorm)) {
                return true;
            }

            return false;
        }
        
        function resaltarTexto(texto, busqueda) {
            if (!busqueda || busqueda.trim() === '') return texto;
            
            const busquedaEscapada = busqueda.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            // NOTA: Para resaltar, usamos la búsqueda ORIGINAL (con acentos) para que coincida visualmente con el texto
            // Pero si el usuario busca sin acento, el texto original tiene acento y no resaltará.
            // Para solucionarlo, podemos usar una versión más compleja, pero por simplicidad dejamos el resaltado exacto.
            // Otra opción es resaltar la búsqueda normalizada, pero no coincide visualmente.
            // Por ahora, dejamos el resaltado exacto (sensible a acentos) para no complicar.
            const regex = new RegExp(`(${busquedaEscapada})`, 'gi');
            return texto.replace(regex, '<span class="highlight">$1</span>');
        }
        
        function obtenerEventoPorIndice(indice) {
            if (indice < 0 || indice >= eventosFiltrados.length) return null;
            return eventosFiltrados[indice];
        }
        
        function actualizarVista() {
            if (!eventosFiltrados.length) return;
            
            const eventoAnterior = obtenerEventoPorIndice(indiceActual - 1);
            const eventoActual = eventosFiltrados[indiceActual];
            const eventoSiguiente = obtenerEventoPorIndice(indiceActual + 1);
            
            const topDiv = document.getElementById('fechaTop');
            if (eventoAnterior) {
                topDiv.textContent = formatearFechaCorta(eventoAnterior.FECHA);
                topDiv.style.opacity = '0.5';
                topDiv.style.display = 'block';
            } else {
                topDiv.textContent = '---';
                topDiv.style.opacity = '0.3';
            }
            
            const centerDiv = document.getElementById('fechaCenter');
            centerDiv.textContent = formatearFechaCorta(eventoActual.FECHA);
            
            const bottomDiv = document.getElementById('fechaBottom');
            if (eventoSiguiente) {
                bottomDiv.textContent = formatearFechaCorta(eventoSiguiente.FECHA);
                bottomDiv.style.opacity = '0.5';
                bottomDiv.style.display = 'block';
            } else {
                bottomDiv.textContent = '---';
                bottomDiv.style.opacity = '0.3';
            }
            
            const filtroContainer = document.getElementById('filtroMensaje');
            if (modoBusqueda) {
                filtroContainer.innerHTML = `<div class="filtro-mensaje">🔍 ${eventosFiltrados.length} resultado(s) para: "${textoBusqueda}"</div>`;
            } else {
                filtroContainer.innerHTML = '';
            }
            
            const detalleDiv = document.getElementById('detalleEvento');
            const extraDiv = document.getElementById('extraInfo');
            
            const fechaLegible = formatearFechaLegible(eventoActual.FECHA);
            
            let textoResaltado = eventoActual.EFEMERIDE;
            if (modoBusqueda && textoBusqueda) {
                textoResaltado = resaltarTexto(eventoActual.EFEMERIDE, textoBusqueda);
            }
            
            detalleDiv.innerHTML = `<div class="detalle-descripcion">📖 ${textoResaltado}</div>`;
            extraDiv.innerHTML = `${modoBusqueda ? 'Resultado ' : 'Evento '} ${indiceActual + 1} de ${eventosFiltrados.length}`;
            
            detalleDiv.scrollTop = 0;
        }
        
        function buscarEventos() {
            const input = document.getElementById('inputBusqueda');
            textoBusqueda = input.value.trim();
            
            if (textoBusqueda === '') {
                eventosFiltrados = [...eventosOriginales];
                modoBusqueda = false;
            } else {
                eventosFiltrados = eventosOriginales.filter(evento => 
                    eventoCoincide(evento, textoBusqueda)
                );
                modoBusqueda = true;
            }
            
            if (eventosFiltrados.length === 0) {
                document.getElementById('detalleEvento').innerHTML = `<div class="detalle-descripcion" style="text-align:center;">🔍 No se encontró "${textoBusqueda}"</div>`;
                document.getElementById('fechaTop').textContent = '---';
                document.getElementById('fechaCenter').textContent = '---';
                document.getElementById('fechaBottom').textContent = '---';
                document.getElementById('extraInfo').innerHTML = '';
                document.getElementById('filtroMensaje').innerHTML = `<div class="filtro-mensaje">🔍 No hay resultados para: "${textoBusqueda}"</div>`;
                return;
            }
            
            indiceActual = 0;
            actualizarVista();
        }
        
        function limpiarBusqueda() {
            document.getElementById('inputBusqueda').value = '';
            eventosFiltrados = [...eventosOriginales];
            modoBusqueda = false;
            textoBusqueda = '';
            indiceActual = 0;
            actualizarVista();
        }
        
        function moverArriba() {
            if (indiceActual > 0) {
                indiceActual--;
                actualizarVista();
                const btn = document.getElementById('btnUp');
                btn.style.transform = 'scale(0.9)';
                setTimeout(() => { btn.style.transform = ''; }, 150);
            } else {
                const btn = document.getElementById('btnUp');
                btn.style.transform = 'scale(0.9)';
                setTimeout(() => { btn.style.transform = ''; }, 200);
            }
        }
        
        function moverAbajo() {
            if (indiceActual < eventosFiltrados.length - 1) {
                indiceActual++;
                actualizarVista();
                const btn = document.getElementById('btnDown');
                btn.style.transform = 'scale(0.9)';
                setTimeout(() => { btn.style.transform = ''; }, 150);
            } else {
                const btn = document.getElementById('btnDown');
                btn.style.transform = 'scale(0.9)';
                setTimeout(() => { btn.style.transform = ''; }, 200);
            }
        }
        
        document.getElementById('fechaTop').addEventListener('click', () => {
            if (indiceActual > 0) moverArriba();
        });
        
        document.getElementById('fechaBottom').addEventListener('click', () => {
            if (indiceActual < eventosFiltrados.length - 1) moverAbajo();
        });
        
        document.getElementById('btnUp').addEventListener('click', moverArriba);
        document.getElementById('btnDown').addEventListener('click', moverAbajo);
        document.getElementById('btnBuscar').addEventListener('click', buscarEventos);
        document.getElementById('btnLimpiar').addEventListener('click', limpiarBusqueda);
        document.getElementById('inputBusqueda').addEventListener('keypress', (e) => { if (e.key === 'Enter') buscarEventos(); });
        
        window.addEventListener('DOMContentLoaded', cargarEventos);
    </script>
</body>
</html>
