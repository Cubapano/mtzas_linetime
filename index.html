<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Navegador Cronológico - Efemérides</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .contenedor {
            background: white;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            margin: 0 auto;
        }
        
        h1 {
            color: #333;
            margin: 0 0 20px 0;
            font-size: 1.6em;
            text-align: center;
        }
        
        /* Buscador - botones grandes */
        .buscador {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        #inputBusqueda {
            flex: 1;
            padding: 14px 16px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 50px;
            outline: none;
            background: white;
        }
        
        #inputBusqueda:focus {
            border-color: #667eea;
        }
        
        .btn-icono {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            font-size: 1.4em;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #f0f0f0;
            color: #555;
        }
        
        #btnBuscar {
            background: #667eea;
            color: white;
        }
        
        #btnBuscar:hover, #btnLimpiar:hover {
            transform: scale(0.96);
        }
        
        /* Navegador principal - botones grandes */
        .navegador {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        .nav-btn {
            background: #667eea;
            color: white;
            border: none;
            font-size: 2em;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        
        .nav-btn:active {
            transform: scale(0.95);
        }
        
        #fechaActual {
            font-size: 1.3em;
            font-weight: bold;
            color: #667eea;
            background: #f0f0f0;
            padding: 14px 20px;
            border-radius: 50px;
            min-width: 200px;
            text-align: center;
        }
        
        /* Evento actual - área principal */
        .evento {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px;
            border-radius: 20px;
            margin: 15px 0 20px;
            animation: aparecer 0.3s ease;
        }
        
        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .descripcion {
            font-size: 1.2em;
            line-height: 1.5;
            margin: 0;
        }
        
        .contador {
            text-align: center;
            color: #999;
            margin-top: 15px;
            font-size: 0.9em;
        }
        
        .resultado-busqueda {
            background: #e3f2fd;
            color: #1976d2;
            padding: 10px 16px;
            border-radius: 30px;
            margin-bottom: 15px;
            font-size: 0.9em;
            text-align: center;
            display: inline-block;
            width: auto;
        }
        
        /* === LÍNEA DE TIEMPO VERTICAL === */
        .timeline-vertical {
            margin: 20px 0;
            max-height: 280px;
            overflow-y: auto;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            padding: 10px 0;
        }
        
        .timeline-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 16px;
            margin: 4px 0;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #f9f9f9;
        }
        
        .timeline-item.activo {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .timeline-item.activo .timeline-fecha,
        .timeline-item.activo .timeline-texto {
            color: white;
        }
        
        .timeline-item:active {
            transform: scale(0.98);
        }
        
        .timeline-marcador {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #667eea;
            flex-shrink: 0;
        }
        
        .timeline-item.activo .timeline-marcador {
            background: white;
            width: 14px;
            height: 14px;
        }
        
        .timeline-fecha {
            font-size: 0.85em;
            font-weight: bold;
            color: #667eea;
            min-width: 70px;
            flex-shrink: 0;
        }
        
        .timeline-item.activo .timeline-fecha {
            color: white;
        }
        
        .timeline-texto {
            font-size: 0.85em;
            color: #555;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }
        
        .timeline-item.activo .timeline-texto {
            color: white;
        }
        
        /* Scroll personalizado */
        .timeline-vertical::-webkit-scrollbar {
            width: 4px;
        }
        .timeline-vertical::-webkit-scrollbar-track {
            background: #e0e0e0;
            border-radius: 4px;
        }
        .timeline-vertical::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
        }
        
        .error {
            color: #c62828;
            padding: 20px;
            background: #ffebee;
            border-radius: 10px;
            text-align: center;
        }
        
        /* Ajustes para móvil muy pequeño */
        @media (max-width: 480px) {
            .contenedor {
                padding: 16px;
            }
            .nav-btn {
                width: 56px;
                height: 56px;
                font-size: 1.8em;
            }
            #fechaActual {
                font-size: 1.1em;
                padding: 12px 16px;
                min-width: 160px;
            }
            .descripcion {
                font-size: 1em;
            }
            .timeline-fecha {
                min-width: 60px;
                font-size: 0.75em;
            }
            .timeline-texto {
                font-size: 0.75em;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>📅 Navegador Cronológico</h1>
        
        <!-- Buscador -->
        <div class="buscador">
            <input type="text" id="inputBusqueda" placeholder="Buscar...">
            <button id="btnBuscar" class="btn-icono" title="Buscar">🔍</button>
            <button id="btnLimpiar" class="btn-icono" title="Limpiar">✖</button>
        </div>
        
        <!-- Línea de tiempo VERTICAL -->
        <div class="timeline-vertical" id="timelineVertical">
            <!-- Se llena con JavaScript -->
        </div>
        
        <!-- Navegador principal -->
        <div class="navegador">
            <button id="btnAnterior" class="nav-btn" title="Anterior">◀</button>
            <div id="fechaActual">Cargando...</div>
            <button id="btnSiguiente" class="nav-btn" title="Siguiente">▶</button>
        </div>
        
        <!-- Evento actual -->
        <div id="contenedor-evento">
            <div class="cargando" style="text-align:center; padding:20px;">Cargando eventos...</div>
        </div>
    </div>

    <script>
        let eventosOriginales = [];
        let eventosFiltrados = [];
        let indiceActual = 0;
        let modoBusqueda = false;
        let textoBusqueda = '';
        
        async function cargarEventos() {
            try {
                const respuesta = await fetch('efemerides.json');
                if (!respuesta.ok) throw new Error(`Error ${respuesta.status}`);
                
                eventosOriginales = await respuesta.json();
                
                if (!eventosOriginales || eventosOriginales.length === 0) {
                    document.getElementById('contenedor-evento').innerHTML = '<div class="error">No hay eventos</div>';
                    return;
                }
                
                // Ordenar por fecha
                eventosOriginales.sort((a, b) => {
                    const fechaA = parsearFechaParaOrden(a.FECHA);
                    const fechaB = parsearFechaParaOrden(b.FECHA);
                    return fechaA - fechaB;
                });
                
                eventosFiltrados = [...eventosOriginales];
                indiceActual = 0;
                
                actualizarTimelineVertical();
                mostrarEvento(indiceActual);
                
            } catch (error) {
                document.getElementById('contenedor-evento').innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }
        
        function parsearFechaParaOrden(fechaStr) {
            const partes = fechaStr.split('-');
            let anio = parseInt(partes[0]);
            let mes = parseInt(partes[1]) - 1;
            let dia = parseInt(partes[2]);
            if (isNaN(mes) || mes < 0) mes = 0;
            if (isNaN(dia) || dia < 1) dia = 1;
            return new Date(anio, mes, dia);
        }
        
        function formatearFechaLegible(fechaISO) {
            const partes = fechaISO.split('-');
            const anio = parseInt(partes[0]);
            const mesNumero = parseInt(partes[1]);
            const diaNumero = parseInt(partes[2]);
            const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 
                          'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
            
            if (mesNumero === 0 && diaNumero === 0) return `Año ${anio}`;
            if (diaNumero === 0 && mesNumero >= 1) return `${meses[mesNumero-1]} de ${anio}`;
            if (diaNumero >= 1 && mesNumero >= 1) return `${diaNumero} de ${meses[mesNumero-1]} de ${anio}`;
            return `${anio}`;
        }
        
        function formatearFechaCorta(fechaISO) {
            const partes = fechaISO.split('-');
            const anio = parseInt(partes[0]);
            const mesNumero = parseInt(partes[1]);
            if (mesNumero === 0) return `${anio}`;
            const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
            return `${meses[mesNumero-1]} ${anio}`;
        }
        
        function acortarTexto(texto, maxLen = 45) {
            if (texto.length <= maxLen) return texto;
            return texto.substring(0, maxLen) + '…';
        }
        
        function actualizarTimelineVertical() {
            const container = document.getElementById('timelineVertical');
            if (!container) return;
            
            if (eventosFiltrados.length === 0) {
                container.innerHTML = '<div style="padding:20px;text-align:center;color:#999;">Sin resultados</div>';
                return;
            }
            
            container.innerHTML = eventosFiltrados.map((evento, idx) => `
                <div class="timeline-item ${idx === indiceActual ? 'activo' : ''}" data-idx="${idx}">
                    <div class="timeline-marcador"></div>
                    <div class="timeline-fecha">${formatearFechaCorta(evento.FECHA)}</div>
                    <div class="timeline-texto">${acortarTexto(evento.EFEMERIDE, 40)}</div>
                </div>
            `).join('');
            
            // Evento click en cada item
            document.querySelectorAll('.timeline-item').forEach(item => {
                item.addEventListener('click', () => {
                    const idx = parseInt(item.dataset.idx);
                    if (!isNaN(idx) && idx >= 0 && idx < eventosFiltrados.length) {
                        indiceActual = idx;
                        mostrarEvento(indiceActual);
                        actualizarTimelineVertical();
                        // Auto-scroll al elemento activo
                        const activo = document.querySelector('.timeline-item.activo');
                        if (activo) activo.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                });
            });
            
            // Scroll automático al elemento activo
            const activo = document.querySelector('.timeline-item.activo');
            if (activo) activo.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        
        function buscarEventos() {
            const input = document.getElementById('inputBusqueda');
            textoBusqueda = input.value.trim().toLowerCase();
            
            if (textoBusqueda === '') {
                eventosFiltrados = [...eventosOriginales];
                modoBusqueda = false;
            } else {
                eventosFiltrados = eventosOriginales.filter(evento => 
                    evento.EFEMERIDE.toLowerCase().includes(textoBusqueda)
                );
                modoBusqueda = true;
            }
            
            if (eventosFiltrados.length === 0) {
                document.getElementById('contenedor-evento').innerHTML = `<div class="error">🔍 No se encontró "${textoBusqueda}"</div>`;
                document.getElementById('fechaActual').textContent = 'Sin resultados';
                document.getElementById('timelineVertical').innerHTML = '<div style="padding:20px;text-align:center;color:#999;">Sin resultados</div>';
                return;
            }
            
            indiceActual = 0;
            actualizarTimelineVertical();
            mostrarEvento(indiceActual);
        }
        
        function limpiarBusqueda() {
            document.getElementById('inputBusqueda').value = '';
            eventosFiltrados = [...eventosOriginales];
            modoBusqueda = false;
            textoBusqueda = '';
            indiceActual = 0;
            actualizarTimelineVertical();
            mostrarEvento(indiceActual);
        }
        
        function mostrarEvento(indice) {
            if (!eventosFiltrados.length) return;
            
            if (indice < 0) indice = 0;
            if (indice >= eventosFiltrados.length) indice = eventosFiltrados.length - 1;
            indiceActual = indice;
            
            const evento = eventosFiltrados[indiceActual];
            const fechaLegible = formatearFechaLegible(evento.FECHA);
            document.getElementById('fechaActual').textContent = fechaLegible;
            
            const contenedor = document.getElementById('contenedor-evento');
            contenedor.style.animation = 'none';
            
            setTimeout(() => {
                let html = '';
                if (modoBusqueda) {
                    html += `<div style="text-align:center;"><div class="resultado-busqueda">🔍 ${eventosFiltrados.length} resultado(s): "${textoBusqueda}"</div></div>`;
                }
                html += `
                    <div class="evento">
                        <div class="descripcion">📖 ${evento.EFEMERIDE}</div>
                    </div>
                    <div class="contador">
                        ${modoBusqueda ? 'Resultado ' : 'Evento '} ${indiceActual + 1} de ${eventosFiltrados.length}
                    </div>
                `;
                contenedor.innerHTML = html;
                contenedor.style.animation = 'aparecer 0.3s ease';
            }, 10);
            
            actualizarTimelineVertical();
        }
        
        function eventoAnterior() {
            if (indiceActual > 0) {
                indiceActual--;
                mostrarEvento(indiceActual);
            } else {
                const btn = document.getElementById('btnAnterior');
                btn.style.transform = 'scale(0.9)';
                setTimeout(() => { btn.style.transform = ''; }, 150);
            }
        }
        
        function eventoSiguiente() {
            if (indiceActual < eventosFiltrados.length - 1) {
                indiceActual++;
                mostrarEvento(indiceActual);
            } else {
                const btn = document.getElementById('btnSiguiente');
                btn.style.transform = 'scale(0.9)';
                setTimeout(() => { btn.style.transform = ''; }, 150);
            }
        }
        
        // Event listeners
        document.getElementById('btnAnterior').addEventListener('click', eventoAnterior);
        document.getElementById('btnSiguiente').addEventListener('click', eventoSiguiente);
        document.getElementById('btnBuscar').addEventListener('click', buscarEventos);
        document.getElementById('btnLimpiar').addEventListener('click', limpiarBusqueda);
        document.getElementById('inputBusqueda').addEventListener('keypress', (e) => { if (e.key === 'Enter') buscarEventos(); });
        
        window.addEventListener('DOMContentLoaded', cargarEventos);
    </script>
</body>
</html>
