<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Navegador Cronológico - Efemérides</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .contenedor {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        
        /* Estilos del buscador */
        .buscador {
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        #inputBusqueda {
            flex: 1;
            min-width: 200px;
            padding: 12px 20px;
            font-size: 1em;
            border: 2px solid #ddd;
            border-radius: 50px;
            outline: none;
            transition: all 0.3s ease;
        }
        
        #inputBusqueda:focus {
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102,126,234,0.3);
        }
        
        #btnBuscar, #btnLimpiar {
            padding: 12px 25px;
            font-size: 1em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        #btnBuscar {
            background: #667eea;
            color: white;
        }
        
        #btnBuscar:hover {
            background: #764ba2;
        }
        
        #btnLimpiar {
            background: #f0f0f0;
            color: #666;
        }
        
        #btnLimpiar:hover {
            background: #ddd;
        }
        
        .navegador {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            font-size: 1.5em;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        button:hover {
            background: #764ba2;
            transform: scale(1.1);
        }
        
        #fechaActual {
            font-size: 1.3em;
            font-weight: bold;
            color: #667eea;
            background: #f0f0f0;
            padding: 12px 25px;
            border-radius: 50px;
            min-width: 280px;
        }
        
        .evento {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            margin-top: 20px;
            animation: aparecer 0.5s ease;
        }
        
        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .descripcion {
            font-size: 1.2em;
            line-height: 1.5;
            margin: 15px 0;
        }
        
        .contador {
            color: #999;
            margin-top: 20px;
            font-size: 0.9em;
        }
        
        .resultado-busqueda {
            background: #e3f2fd;
            color: #1976d2;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 0.9em;
        }
        
        .error {
            color: #c62828;
            padding: 20px;
            background: #ffebee;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>📅 Navegador Cronológico</h1>
        
        <!-- Buscador -->
        <div class="buscador">
            <input type="text" id="inputBusqueda" placeholder="Buscar por palabra clave... ej: fundación, colon, revolución">
            <button id="btnBuscar">🔍 Buscar</button>
            <button id="btnLimpiar">✖ Limpiar</button>
        </div>
        
        <div class="navegador">
            <button id="btnAnterior" title="Evento anterior">◀</button>
            <div id="fechaActual">Cargando...</div>
            <button id="btnSiguiente" title="Evento siguiente">▶</button>
        </div>
        
        <div id="contenedor-evento">
            <div class="cargando">Cargando eventos...</div>
        </div>
    </div>

    <script>
        let eventosOriginales = [];  // Guardar todos los eventos
        let eventosFiltrados = [];    // Eventos después de búsqueda
        let indiceActual = 0;
        let modoBusqueda = false;
        let textoBusqueda = '';
        
        async function cargarEventos() {
            const contenedorEvento = document.getElementById('contenedor-evento');
            
            try {
                const respuesta = await fetch('efemerides.json');
                
                if (!respuesta.ok) {
                    throw new Error(`No se pudo cargar el archivo. Código: ${respuesta.status}`);
                }
                
                eventosOriginales = await respuesta.json();
                
                if (!eventosOriginales || eventosOriginales.length === 0) {
                    contenedorEvento.innerHTML = '<div class="error">No hay eventos para mostrar</div>';
                    return;
                }
                
                // Ordenar eventos originales por fecha
                eventosOriginales.sort((a, b) => {
                    const fechaA = parsearFechaParaOrden(a.FECHA);
                    const fechaB = parsearFechaParaOrden(b.FECHA);
                    return fechaA - fechaB;
                });
                
                // Inicialmente mostrar todos
                eventosFiltrados = [...eventosOriginales];
                indiceActual = 0;
                mostrarEvento(indiceActual);
                
            } catch (error) {
                contenedorEvento.innerHTML = `
                    <div class="error">
                        ❌ Error al cargar las efemérides<br>
                        <small>${error.message}</small>
                    </div>
                `;
                console.error('Error:', error);
            }
        }
        
        function parsearFechaParaOrden(fechaStr) {
            const partes = fechaStr.split('-');
            let anio = parseInt(partes[0]);
            let mes = parseInt(partes[1]) - 1;
            let dia = parseInt(partes[2]);
            
            if (isNaN(mes) || mes < 0) mes = 0;
            if (isNaN(dia) || dia < 1) dia = 1;
            
            return new Date(anio, mes, dia);
        }
        
        function formatearFechaLegible(fechaISO) {
            const partes = fechaISO.split('-');
            const anio = parseInt(partes[0]);
            const mesNumero = parseInt(partes[1]);
            const diaNumero = parseInt(partes[2]);
            
            const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 
                          'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
            
            if (mesNumero === 0 && diaNumero === 0) {
                return `Año ${anio}`;
            }
            
            if (diaNumero === 0 && mesNumero >= 1 && mesNumero <= 12) {
                return `${meses[mesNumero - 1]} de ${anio}`;
            }
            
            if (diaNumero >= 1 && diaNumero <= 31 && mesNumero >= 1 && mesNumero <= 12) {
                return `${diaNumero} de ${meses[mesNumero - 1]} de ${anio}`;
            }
            
            return `${anio}`;
        }
        
        function buscarEventos() {
            const input = document.getElementById('inputBusqueda');
            textoBusqueda = input.value.trim().toLowerCase();
            
            if (textoBusqueda === '') {
                // Si está vacío, mostrar todos
                eventosFiltrados = [...eventosOriginales];
                modoBusqueda = false;
                document.getElementById('contenedor-evento').innerHTML = '';
            } else {
                // Filtrar eventos que contengan la palabra en EFEMERIDE
                eventosFiltrados = eventosOriginales.filter(evento => 
                    evento.EFEMERIDE.toLowerCase().includes(textoBusqueda)
                );
                modoBusqueda = true;
            }
            
            if (eventosFiltrados.length === 0) {
                // No hay resultados
                const contenedor = document.getElementById('contenedor-evento');
                contenedor.innerHTML = `
                    <div class="error">
                        🔍 No se encontraron eventos que contengan "<strong>${textoBusqueda}</strong>"<br>
                        <small>Intenta con otra palabra clave</small>
                    </div>
                `;
                document.getElementById('fechaActual').textContent = 'Sin resultados';
                return;
            }
            
            // Resetear al primer resultado
            indiceActual = 0;
            mostrarEvento(indiceActual);
        }
        
        function limpiarBusqueda() {
            document.getElementById('inputBusqueda').value = '';
            eventosFiltrados = [...eventosOriginales];
            modoBusqueda = false;
            textoBusqueda = '';
            indiceActual = 0;
            mostrarEvento(indiceActual);
        }
        
        function mostrarEvento(indice) {
            if (!eventosFiltrados || eventosFiltrados.length === 0) return;
            
            if (indice < 0) indice = 0;
            if (indice >= eventosFiltrados.length) indice = eventosFiltrados.length - 1;
            
            const evento = eventosFiltrados[indice];
            const fechaLegible = formatearFechaLegible(evento.FECHA);
            
            document.getElementById('fechaActual').textContent = fechaLegible;
            
            const contenedorEvento = document.getElementById('contenedor-evento');
            contenedorEvento.style.animation = 'none';
            
            setTimeout(() => {
                let html = '';
                
                // Mostrar info de búsqueda si estamos en modo búsqueda
                if (modoBusqueda) {
                    html += `<div class="resultado-busqueda">
                        🔍 Mostrando ${eventosFiltrados.length} resultado(s) para: "<strong>${textoBusqueda}</strong>"
                    </div>`;
                }
                
                html += `
                    <div class="evento">
                        <div class="descripcion">📖 ${evento.EFEMERIDE}</div>
                    </div>
                    <div class="contador">
                        ${modoBusqueda ? 'Resultado ' : 'Evento '} ${indice + 1} de ${eventosFiltrados.length}
                    </div>
                `;
                
                contenedorEvento.innerHTML = html;
                contenedorEvento.style.animation = 'aparecer 0.5s ease';
            }, 10);
        }
        
        function eventoAnterior() {
            if (indiceActual > 0) {
                indiceActual--;
                mostrarEvento(indiceActual);
            } else {
                const btn = document.getElementById('btnAnterior');
                btn.style.transform = 'scale(0.9)';
                setTimeout(() => { btn.style.transform = ''; }, 200);
            }
        }
        
        function eventoSiguiente() {
            if (indiceActual < eventosFiltrados.length - 1) {
                indiceActual++;
                mostrarEvento(indiceActual);
            } else {
                const btn = document.getElementById('btnSiguiente');
                btn.style.transform = 'scale(0.9)';
                setTimeout(() => { btn.style.transform = ''; }, 200);
            }
        }
        
        // Conectar eventos a los botones
        document.getElementById('btnAnterior').addEventListener('click', eventoAnterior);
        document.getElementById('btnSiguiente').addEventListener('click', eventoSiguiente);
        document.getElementById('btnBuscar').addEventListener('click', buscarEventos);
        document.getElementById('btnLimpiar').addEventListener('click', limpiarBusqueda);
        
        // Permitir buscar presionando Enter
        document.getElementById('inputBusqueda').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                buscarEventos();
            }
        });
        
        window.addEventListener('DOMContentLoaded', cargarEventos);
    </script>
</body>
</html>
